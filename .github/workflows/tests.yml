name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints/*.txt
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-dev.txt -c constraints/windows-py313.txt
      - if: runner.os != 'Windows'
        run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      # No API keys in CI: the suite runs in offline (local-models-only) mode.
      - run: python -m pytest -q
